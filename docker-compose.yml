# ========================================
# Docker Compose pour Système de Prédiction Master
# Version: 3.8 (Docker Swarm compatible)
# ========================================

version: '3.8'

# ========================================
# NETWORKS
# ========================================
networks:
  frontend:
    driver: overlay
    attachable: true
  backend:
    driver: overlay
    internal: false
  database:
    driver: overlay
    internal: true

# ========================================
# VOLUMES
# ========================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  ml_models:
    driver: local
  app_storage:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ========================================
# SECRETS
# ========================================
secrets:
  db_password:
    external: true
  db_root_password:
    external: true
  redis_password:
    external: true
  app_key:
    external: true

# ========================================
# SERVICES
# ========================================
services:

  # ========================================
  # NGINX LOAD BALANCER
  # ========================================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - frontend
    deploy:
      mode: replicated
      replicas: 2
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ========================================
  # LARAVEL APPLICATION
  # ========================================
  laravel:
    build:
      context: .
      dockerfile: Dockerfile.laravel
    image: esudelib/laravel:latest
    volumes:
      - app_storage:/var/www/html/storage
      - ml_models:/var/www/html/storage/ml
      - ./storage/logs:/var/www/html/storage/logs
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=esudelib_db
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHON_PATH=/usr/bin/python3
    secrets:
      - db_password
      - app_key
      - redis_password
    networks:
      - frontend
      - backend
      - database
    deploy:
      mode: replicated
      replicas: 3
      placement:
        constraints:
          - node.role == worker
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "php-fpm-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    depends_on:
      - mysql
      - redis

  # ========================================
  # PYTHON ML SERVICE
  # ========================================
  ml_service:
    build:
      context: .
      dockerfile: Dockerfile.ml
    image: esudelib/ml-service:latest
    volumes:
      - ml_models:/app/models
      - ./storage/ml/datasets:/app/datasets
    environment:
      - FLASK_ENV=production
      - MODEL_PATH=/app/models/master_prediction_model.pkl
    networks:
      - backend
    deploy:
      mode: replicated
      replicas: 3
      placement:
        constraints:
          - node.role == worker
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ========================================
  # FRONTEND (React/Vite)
  # ========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: esudelib/frontend:latest
    networks:
      - frontend
    deploy:
      mode: replicated
      replicas: 2
      placement:
        constraints:
          - node.role == worker
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ========================================
  # MYSQL DATABASE (Master)
  # ========================================
  mysql:
    image: mysql:8.0
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    environment:
      - MYSQL_DATABASE=esudelib_db
      - MYSQL_USER=esudelib_user
    secrets:
      - source: db_password
        target: MYSQL_PASSWORD
      - source: db_root_password
        target: MYSQL_ROOT_PASSWORD
    networks:
      - database
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.database == primary
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s

  # ========================================
  # MYSQL REPLICA (Slave)
  # ========================================
  mysql_replica:
    image: mysql:8.0
    volumes:
      - ./docker/mysql/my-replica.cnf:/etc/mysql/conf.d/my.cnf:ro
    environment:
      - MYSQL_DATABASE=esudelib_db
      - MYSQL_USER=esudelib_user
    secrets:
      - source: db_password
        target: MYSQL_PASSWORD
      - source: db_root_password
        target: MYSQL_ROOT_PASSWORD
    networks:
      - database
    deploy:
      mode: replicated
      replicas: 2
      placement:
        constraints:
          - node.labels.database == replica
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    depends_on:
      - mysql

  # ========================================
  # REDIS CACHE (Master)
  # ========================================
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - backend
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.cache == primary
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ========================================
  # REDIS REPLICA (Slave)
  # ========================================
  redis_replica:
    image: redis:7-alpine
    command: redis-server --slaveof redis 6379 --requirepass ${REDIS_PASSWORD}
    networks:
      - backend
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.cache == replica
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      - redis

  # ========================================
  # PROMETHEUS (Monitoring)
  # ========================================
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - backend
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ========================================
  # GRAFANA (Visualization)
  # ========================================
  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - backend
      - frontend
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      - prometheus

  # ========================================
  # PORTAINER (Container Management)
  # ========================================
  portainer:
    image: portainer/portainer-ce:latest
    command: -H tcp://tasks.agent:9001 --tlsskipverify
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/portainer/data:/data
    networks:
      - frontend
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  # ========================================
  # PORTAINER AGENT
  # ========================================
  agent:
    image: portainer/agent:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - frontend
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
